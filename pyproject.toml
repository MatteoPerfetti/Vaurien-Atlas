[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaurien-atlas"
version = "0.1.0"
description = "A personal research and learning application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
analyst = ["openai>=1,<3"]
signin-test = ["openai>=1,<3", "PyJWT[crypto]>=2.8,<3"]

[project.scripts]
vaurien-atlas = "vaurien_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaurien_atlas = ["instructions/*.txt"]
